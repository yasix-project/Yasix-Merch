services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yasix-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      # Menggunakan hostname 'mysql_db' untuk komunikasi antar-container di jaringan Docker
      - DATABASE_URL=mysql://root:password_admin_123@mysql_db:3306/db_business_center
      - JWT_SECRET=super_secret_jwt_key_gtnic_2026
      - JWT_EXPIRES_IN=1d
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - yasix-network

  mysql_db:
    image: mysql:8.0
    container_name: yasix-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: password_admin_123
      MYSQL_DATABASE: db_business_center
    ports:
      # Port 3306 dibuka ke host agar localhost:3306 bisa diakses dari MySQL Workbench / Prisma Studio
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-ppassword_admin_123",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - yasix-network

volumes:
  mysqldata:
    driver: local

networks:
  yasix-network:
    driver: bridge
